[project]
name = "sahou-harness"
version = "0.1.0"
description = "卅 harness：一个「一切皆插件」的 agent harness（参考 DeepSeek Harness 架构），执行引擎基于 nanoagent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "nanoagent>=0.1.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]

[project.scripts]
sha = "harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
