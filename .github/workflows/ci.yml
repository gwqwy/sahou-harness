name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # nanoagent 尚未发布到 PyPI，必须先从 GitHub 装，否则 `pip install -e .` 解析不了 nanoagent>=0.1.0
          pip install "git+https://github.com/gwqwy/nanoagent.git"
          # 不装 desktop 可选依赖：pywebview 在 Linux 需要 GTK/WebKit 系统库，
          # 而 tests/test_desktop.py 用的是 FakeWindow 假窗口，本来就不需要真实窗口
          pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
