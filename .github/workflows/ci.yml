name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      # 规则集钉在 pyproject [tool.ruff.lint]，升级 ruff 不会悄悄变红
      - name: Ruff
        run: ruff check harness tests tools

  # 已清零（21 个源文件 0 错误），设为阻塞；若未来放宽 host 注入导致新噪声，
  # 可临时加回 continue-on-error: true 降级为 advisory
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install mypy
          pip install "git+https://github.com/gwqwy/nanoagent.git"
          pip install -e . --no-deps
      - name: Mypy
        run: python -m mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # nanoagent 尚未发布到 PyPI，必须先从 GitHub 装，否则 `pip install -e .` 解析不了 nanoagent>=0.1.0
          pip install "git+https://github.com/gwqwy/nanoagent.git"
          # 不装 desktop 可选依赖：pywebview 在 Linux 需要 GTK/WebKit 系统库，
          # 而 tests/test_desktop.py 用的是 FakeWindow 假窗口，本来就不需要真实窗口
          pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

  # 打包回归：内置插件是无 __init__.py 的目录 + plugin.json 是非 .py 数据文件，
  # 曾经全量丢包（wheel 里 0 个 plugin.json）。构建并断言，防止再犯。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Build wheel
        run: python -m build --wheel --no-isolation
      - name: Assert plugin manifests packaged
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          manifests = [n for n in names if n.endswith("plugin.json")]
          assert len(manifests) >= 13, f"wheel 只含 {len(manifests)} 个 plugin.json，内置插件清单丢了"
          assert any(n.endswith("py.typed") for n in names), "py.typed 丢了"
          print(f"OK: {whl} 含 {len(manifests)} 个 plugin.json + py.typed")
          PY
